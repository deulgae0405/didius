<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고전 판타지 방탈출 게임</title>
    <style>
        /* 판타지풍 디자인 스타일 설정 */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a110a; /* 어두운 나무/고성 느낌의 배경색 */
            color: #d4b595; /* 양피지 같은 황토색 텍스트 */
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 800px;
            height: 500px;
            background-color: #2c1d11;
            border: 4px solid #5c3a21;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }

        .page {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            padding: 30px;
            box-sizing: border-box;
        }

        .page.active {
            display: block;
        }

        h2 {
            border-bottom: 2px solid #5c3a21;
            padding-bottom: 10px;
            margin-top: 0;
            color: #f3e5ab;
        }

        /* 하단 네비게이션 바 */
        #nav-bar {
            width: 800px;
            height: 60px;
            background-color: #1f140c;
            border: 2px solid #5c3a21;
            border-top: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .nav-btn {
            background-color: #3d2614;
            color: #d4b595;
            border: 2px solid #5c3a21;
            padding: 8px 20px;
            font-family: 'Georgia', serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }

        .nav-btn:hover {
            background-color: #5c3a21;
            color: #fff;
        }

        .nav-btn.active-tab {
            background-color: #704214;
            color: #ffd700;
            border-color: #ffd700;
        }

        /* 1페이지 기구들 배치 */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .clickable-item {
            background-color: #3b2716;
            border: 2px dashed #704214;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
            transition: 0.2s;
        }

        .clickable-item:hover {
            background-color: #4e341f;
            border-color: #ffd700;
            color: #fff;
        }

        /* 팝업 창 스타일 */
        #popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #popup-box {
            background-color: #f4e8c1;
            color: #2c1d11;
            padding: 30px;
            border: 4px solid #5c3a21;
            width: 400px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            position: relative;
        }

        #popup-box h3 {
            margin-top: 0;
            color: #5c3a21;
        }

        #close-popup {
            margin-top: 20px;
            background-color: #5c3a21;
            color: #fff;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
        }

        /* 금고 스타일 (2페이지) */
        .safe-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        #safe-display {
            font-size: 32px;
            letter-spacing: 10px;
            background: #111;
            color: #00ff00;
            padding: 10px 20px;
            border: 3px inset #5c3a21;
            margin-bottom: 20px;
            width: 200px;
            text-align: center;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
        }

        .keypad button {
            background-color: #3b2716;
            color: #d4b595;
            border: 2px solid #5c3a21;
            font-size: 20px;
            padding: 15px;
            cursor: pointer;
            border-radius: 4px;
        }

        .keypad button:hover {
            background-color: #5c3a21;
            color: #fff;
        }

        /* 3페이지 상자 스타일 */
        .box-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 60px;
        }

        .spell-input {
            padding: 10px;
            font-size: 18px;
            width: 250px;
            background: #1a110a;
            border: 2px solid #5c3a21;
            color: #ffd700;
            text-align: center;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 단서가 될만한 것들? -->
        <div id="page-1" class="page active">
            <h2>어질러진 도서관</h2>
            <p>디디우스가 금고 암호의 단서가 될만한 여섯가지의 물건을 찾아왔습니다.</p>
            <div class="items-grid">
                <div class="clickable-item" onclick="openPopup('노트', '종이묶음, 첫번째 종이, 세번째 종이, 그림 종이, 두번째 종이.')">📒노트</div>
                <div class="clickable-item" onclick="openPopup('책', '백설공주와 ##난쟁이')">📘 책 </div>
                <div class="clickable-item" onclick="openPopup('쪽지 1', '자수정과 아쿠아마린을 더하면?')">📜 쪽지 1</div>
                <div class="clickable-item" onclick="openPopup('쪽지 2', '여기가 몇층이더라?')">📜 쪽지 2</div>
                <div class="clickable-item" onclick="openPopup('쪽지 3', '소의 위가 몇개인지 알고있어?')">📜 쪽지 3</div>
                <div class="clickable-item" onclick="openPopup('액자', '나비 2마리가 날아오르는 그림 입니다. 그리고 아래에는 [나비의 날개가 신경쓰이네.]라는 문구가 있습니다.')">🖼️ 액자 (나비 그림)</div>
            </div>
        </div>

        <!-- 금고 -->
        <div id="page-2" class="page">
            <h2>철제 금고</h2>
            <div class="safe-section">
                <div id="safe-display">_____</div>
                <div class="keypad">
                    <button onclick="pressKey(1)">1</button>
                    <button onclick="pressKey(2)">2</button>
                    <button onclick="pressKey(3)">3</button>
                    <button onclick="pressKey(4)">4</button>
                    <button onclick="pressKey(5)">5</button>
                    <button onclick="pressKey(6)">6</button>
                    <button onclick="pressKey(7)">7</button>
                    <button onclick="pressKey(8)">8</button>
                    <button onclick="pressKey(9)">9</button>
                    <button onclick="clearSafe()" style="grid-column: span 3; background-color: #5c3a21;">초기화</button>
                </div>
            </div>
        </div>

        <!-- 주문 상자 -->
        <div id="page-3" class="page">
            <h2>봉인된 상자 </h2>
            <div class="box-section">
                <p>상자를 열려면 봉인된 주문을 외워야 합니다. </p>
                <input type="text" id="spell-input" class="spell-input" placeholder="주문을 입력하세요">
                <br>
                <button class="nav-btn" onclick="checkSpell()">주문 외우기</button>
            </div>
        </div>
    </div>

    <!-- 하단 페이지 이동 바 -->
    <div id="nav-bar">
        <button id="btn-1" class="nav-btn active-tab" onclick="switchPage(1)">단서</button>
        <button id="btn-2" class="nav-btn" onclick="switchPage(2)">금고</button>
        <button id="btn-3" class="nav-btn" onclick="switchPage(3)">상자</button>
    </div>

    <!-- 공통 팝업 창 -->
    <div id="popup-overlay">
        <div id="popup-box">
            <h3 id="popup-title">제목</h3>
            <p id="popup-text">내용</p>
            <button id="close-popup" onclick="closePopup()">닫기</button>
        </div>
    </div>

    <script>
        // 페이지 전환 함수
        function switchPage(pageNum) {
            // 모든 페이지 숨기기
            for (let i = 1; i <= 3; i++) {
                document.getElementById('page-' + i).classList.remove('active');
                document.getElementById('btn-' + i).classList.remove('active-tab');
            }
            // 선택한 페이지만 보이기
            document.getElementById('page-' + pageNum).classList.add('active');
            document.getElementById('btn-' + pageNum).classList.add('active-tab');
        }

        // 팝업 열기 함수
        function openPopup(title, text) {
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-text').innerText = text;
            document.getElementById('popup-overlay').style.display = 'flex';
        }

        // 팝업 닫기 함수
        function closePopup() {
            document.getElementById('popup-overlay').style.display = 'none';
        }

        // 금고 비밀번호 로직
        let currentPasswordInput = "";
        const correctPassword = "75483";

        function pressKey(num) {
            if (currentPasswordInput.length < 5) {
                currentPasswordInput += num;
                updateSafeDisplay();
            }

            // 5자리가 다 찼을 때 자동 검사
            if (currentPasswordInput.length === 5) {
                setTimeout(checkSafePassword, 200);
            }
        }

        function clearSafe() {
            currentPasswordInput = "";
            updateSafeDisplay();
        }

        function updateSafeDisplay() {
            let displayStr = currentPasswordInput.padEnd(5, '_');
            document.getElementById('safe-display').innerText = displayStr;
        }

        function checkSafePassword() {
            if (currentPasswordInput === correctPassword) {
                openPopup("금고 개방 성공!", "금고가 열렸습니다! 쪽지를 발견했습니다.\n\n[쪽지 내용]: '책을 찾고싶다면 냐냐냥을 외치세요!'");
            } else {
                alert("비밀번호가 틀렸습니다. 다시 시도하세요.");
                clearSafe();
            }
        }

        // 3페이지 주문 상자 로직
        function checkSpell() {
            let userSpell = document.getElementById('spell-input').value.trim();
            if (userSpell === "냐냐냥") {
                openPopup("봉인 해제!", "상자가 열리며 마법의 책을 찾아냈습니다! 🎉 축하합니다! (*화면을 캡쳐하여 디디우스에게 보여주세요! ) ");
            } else {
                alert("아무 일도 일어나지 않습니다. 주문이 틀린 것 같습니다.");
            }
        }
    </script>
</body>
</html>
